# Ponto de entrada único para as instâncias da app (docker compose --scale app=N).
# O DNS interno do Docker (127.0.0.11) devolve o IP de cada réplica; resolver
# por variável faz o nginx reconsultar e distribuir entre elas.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 80;

  location / {
    set $app http://app:3000;
    proxy_pass $app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # POST não é reenviado pelo proxy: quem reenvia é o cliente, com a mesma
    # Idempotency-Key (é o que torna o reenvio seguro).
  }
}
