services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      # 5433 no host para não colidir com um Postgres instalado localmente
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 4.14.0 é a última versão que roda sem LOCALSTACK_AUTH_TOKEN.
  # A partir de 2026.03 a imagem passou a exigir token.
  localstack:
    image: localstack/localstack:4.14.0
    restart: unless-stopped
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
    healthcheck:
      # só fica saudável depois que o script criou TODAS as filas (a de eventos
      # é a última; checar só a principal deixava a app subir antes dela)
      test:
        - CMD-SHELL
        - >-
          awslocal sqs get-queue-url --queue-name wager-transactions-dlq.fifo &&
          awslocal sqs get-queue-url --queue-name wager-transactions.fifo &&
          awslocal sqs get-queue-url --queue-name wagering-events.fifo
      interval: 3s
      timeout: 5s
      retries: 40

  # Migrations rodam UMA vez, antes das instâncias. Se cada réplica as
  # rodasse ao subir, as três tentariam criar as mesmas tabelas ao mesmo tempo.
  migrate:
    build: .
    image: jungle-wagering:local
    pull_policy: build # imagem local: constrói, nunca tenta baixar de um registro
    command: ["bun", "run", "src/infrastructure/database/migrate.ts", "up"]
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Escala com: docker compose up --build --scale app=3
  app:
    # build próprio: sem ele, numa máquina limpa o Compose tentaria baixar a
    # imagem de um registro ("pull access denied") antes de construí-la
    build: .
    image: jungle-wagering:local
    pull_policy: build # imagem local: constrói, nunca tenta baixar de um registro
    # caiu (falta de memória, erro fatal)? volta sozinha; parada de propósito, não
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wagering-events.fifo
    depends_on:
      migrate:
        condition: service_completed_successfully
      localstack:
        condition: service_healthy
    healthcheck:
      # readiness: Postgres e filas alcançáveis
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/health/ready'); process.exit(r.ok ? 0 : 1)"]
      interval: 3s
      timeout: 5s
      retries: 20
    # SIGTERM: o consumidor termina a mensagem em andamento e a leitura atual
    # (até 10s de long polling) antes de sair
    stop_grace_period: 30s

  # Entrada única em localhost:3000, distribuindo entre as réplicas da app.
  gateway:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
