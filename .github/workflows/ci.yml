name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # o mesmo compose do projeto: também prova que o script de init das filas roda no Linux
      - name: Sobe Postgres e LocalStack
        run: docker compose up -d --wait postgres localstack

      - run: bun install --frozen-lockfile
      - run: cp .env.example .env
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:integration

      # o comando do README: três réplicas atrás do gateway
      - name: Sobe o stack completo e confere a readiness pelo gateway
        run: |
          docker compose up -d --build --wait --scale app=3
          curl --fail --silent --show-error localhost:3000/health/ready

      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color
